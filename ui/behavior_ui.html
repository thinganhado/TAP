<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fraud Detection System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>html,body,#root{height:100%}</style>
  <!-- React 18 UMD -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel so you can paste JSX anywhere, for demos only -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Axios for API calls -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const {useEffect, useState} = React;

    function App(){
      const [file, setFile] = useState(null);
      const [results, setResults] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');
      const [healthStatus, setHealthStatus] = useState(null);

      useEffect(() => {
        checkHealth();
      }, []);

      const checkHealth = async () => {
        try {
          const response = await axios.get('http://localhost:5000/api/health');
          setHealthStatus(response.data);
        } catch (error) {
          setHealthStatus({ status: 'unreachable', error: 'Cannot connect to backend' });
        }
      };

      const handleFileUpload = async (event) => {
        event.preventDefault();
        if (!file) {
          setError('Please select a CSV file first');
          return;
        }

        setLoading(true);
        setError('');
        setResults(null);

        const formData = new FormData();
        formData.append('file', file);

        try {
          const response = await axios.post('http://localhost:5000/api/predict-batch', formData, {
            headers: { 'Content-Type': 'multipart/form-data' },
            timeout: 30000
          });
          setResults(response.data);
        } catch (error) {
          setError(error.response?.data?.error || 'Failed to process file. Please try again.');
        } finally {
          setLoading(false);
        }
      };

      const downloadSampleCSV = () => {
        const sampleCSV = `client_id,event_time,latitude,longitude
client_001,2023-05-15 14:30:00,40.7128,-74.0060
client_002,2023-05-15 15:45:00,34.0522,-118.2437
client_003,2023-05-15 16:20:00,41.8781,-87.6298
client_004,2023-05-15 17:10:00,51.5074,-0.1278
client_005,2023-05-15 18:30:00,48.8566,2.3522`;
        
        const blob = new Blob([sampleCSV], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'sample_transactions.csv';
        a.click();
        window.URL.revokeObjectURL(url);
      };

      const exportResults = () => {
        if (!results) return;
        
        const headers = 'Client ID,Event Time,Prediction,Probability,Fraud Status,Temporal Score,Geographical Score,Behavioral Score,Composite Score\n';
        const csvRows = results.results.map(result => 
          [
            result.client_id,
            result.event_time,
            result.prediction,
            result.probability,
            result.prediction ? 'FRAUD' : 'LEGITIMATE',
            result.specialist_probas.temporal,
            result.specialist_probas.geographical,
            result.specialist_probas.behavioral,
            result.specialist_probas.composite
          ].join(',')
        ).join('\n');
        
        const blob = new Blob([headers + csvRows], { type: 'text/csv' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `fraud_detection_results_${new Date().toISOString().split('T')[0]}.csv`;
        a.click();
        window.URL.revokeObjectURL(url);
      };

      const riskColor = (probability) => {
        if (probability >= 0.8) return 'bg-red-100 text-red-800 border-red-300';
        if (probability >= 0.6) return 'bg-amber-100 text-amber-800 border-amber-300';
        return 'bg-green-100 text-green-800 border-green-300';
      };

      const RiskBadge = ({ probability }) => (
        <span className={`inline-flex items-center rounded-full border px-2 py-1 text-xs font-medium ${riskColor(probability)}`}>
          {(probability * 100).toFixed(1)}%
        </span>
      );

      return (
        <div className="min-h-screen p-6 space-y-6">
          {/* Header */}
          <div className="flex items-center justify-between">
            <div className="flex items-center gap-3">
              <span className="inline-flex h-10 w-10 items-center justify-center rounded-xl bg-blue-600 text-white font-bold text-lg">F</span>
              <div>
                <h1 className="text-2xl font-bold">Fraud Detection System</h1>
                <p className="text-sm text-slate-600">Multi-model ensemble detection for transaction fraud</p>
              </div>
            </div>
            <div className={`px-3 py-2 rounded-lg text-sm font-medium ${
              healthStatus?.status === 'healthy' 
                ? 'bg-green-100 text-green-800' 
                : 'bg-red-100 text-red-800'
            }`}>
              Backend: {healthStatus?.status === 'healthy' ? '✅ Connected' : '❌ Disconnected'}
            </div>
          </div>

          {/* Upload Section */}
          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <div className="lg:col-span-2 rounded-2xl border bg-white p-6 shadow-sm">
              <h2 className="text-lg font-semibold mb-4">Upload Transaction Data</h2>
              
              <form onSubmit={handleFileUpload} className="space-y-4">
                <div>
                  <label className="block text-sm font-medium text-slate-700 mb-2">
                    Select CSV File
                  </label>
                  <input 
                    type="file" 
                    accept=".csv"
                    onChange={(e) => {
                      setFile(e.target.files[0]);
                      setError('');
                    }}
                    className="block w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                  />
                </div>

                <div className="flex items-center gap-3">
                  <button 
                    type="submit" 
                    disabled={loading || !file}
                    className="flex items-center gap-2 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 disabled:bg-slate-400 disabled:cursor-not-allowed"
                  >
                    {loading ? (
                      <>
                        <div className="animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></div>
                        Processing...
                      </>
                    ) : (
                      <>
                        <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                        </svg>
                        Analyze for Fraud
                      </>
                    )}
                  </button>

                  <button 
                    type="button" 
                    onClick={downloadSampleCSV}
                    className="px-4 py-2 border border-slate-300 rounded-lg hover:bg-slate-50"
                  >
                    Download Sample CSV
                  </button>
                </div>
              </form>

              {error && (
                <div className="mt-4 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
                  ❌ {error}
                </div>
              )}

              {healthStatus?.assumption && (
                <div className="mt-4 p-3 bg-blue-50 border border-blue-200 rounded-lg text-blue-700 text-sm">
                  ℹ️ {healthStatus.assumption}
                </div>
              )}
            </div>

            {/* Info Panel */}
            <div className="rounded-2xl border bg-white p-6 shadow-sm">
              <h3 className="text-lg font-semibold mb-4">System Information</h3>
              <div className="space-y-3 text-sm">
                <div className="flex justify-between">
                  <span className="text-slate-600">Models Loaded:</span>
                  <span className="font-medium">5 Specialist Models</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-600">Detection Method:</span>
                  <span className="font-medium">Ensemble Learning</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-600">Client History:</span>
                  <span className="font-medium">All Treated as New</span>
                </div>
                <div className="flex justify-between">
                  <span className="text-slate-600">Features Analyzed:</span>
                  <span className="font-medium">Temporal, Geographic, Behavioral</span>
                </div>
              </div>

              <div className="mt-6 p-3 bg-slate-50 rounded-lg">
                <h4 className="font-medium mb-2">Required CSV Columns:</h4>
                <code className="text-xs bg-white p-2 rounded border block">
                  client_id, event_time, latitude, longitude
                </code>
              </div>
            </div>
          </div>

          {/* Results Section */}
          {results && (
            <div className="space-y-6">
              {/* Summary Cards */}
              <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                <div className="rounded-2xl border bg-white p-4 shadow-sm">
                  <div className="text-2xl font-bold text-blue-600">{results.total_transactions}</div>
                  <div className="text-sm text-slate-600">Total Transactions</div>
                </div>
                <div className="rounded-2xl border bg-white p-4 shadow-sm">
                  <div className="text-2xl font-bold text-red-600">{results.fraud_count}</div>
                  <div className="text-sm text-slate-600">Fraud Detected</div>
                </div>
                <div className="rounded-2xl border bg-white p-4 shadow-sm">
                  <div className="text-2xl font-bold text-green-600">{results.legitimate_count}</div>
                  <div className="text-sm text-slate-600">Legitimate</div>
                </div>
                <div className="rounded-2xl border bg-white p-4 shadow-sm">
                  <div className="text-2xl font-bold text-amber-600">{results.fraud_percentage.toFixed(1)}%</div>
                  <div className="text-sm text-slate-600">Fraud Rate</div>
                </div>
              </div>

              {/* Results Table */}
              <div className="rounded-2xl border bg-white shadow-sm">
                <div className="p-4 border-b flex justify-between items-center">
                  <h3 className="text-lg font-semibold">Detection Results</h3>
                  <button 
                    onClick={exportResults}
                    className="flex items-center gap-2 px-3 py-2 bg-green-600 text-white text-sm rounded-lg hover:bg-green-700"
                  >
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    Export Results
                  </button>
                </div>
                
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead className="bg-slate-50">
                      <tr>
                        <th className="p-3 text-left font-medium">Client ID</th>
                        <th className="p-3 text-left font-medium">Event Time</th>
                        <th className="p-3 text-left font-medium">Status</th>
                        <th className="p-3 text-left font-medium">Probability</th>
                        <th className="p-3 text-left font-medium">Specialist Scores</th>
                      </tr>
                    </thead>
                    <tbody>
                      {results.results.map((result, index) => (
                        <tr key={index} className="border-t hover:bg-slate-50">
                          <td className="p-3 font-mono text-xs">{result.client_id}</td>
                          <td className="p-3">{result.event_time}</td>
                          <td className="p-3">
                            <span className={`inline-flex items-center px-2 py-1 rounded-full text-xs font-medium ${
                              result.prediction 
                                ? 'bg-red-100 text-red-800' 
                                : 'bg-green-100 text-green-800'
                            }`}>
                              {result.prediction ? '🚨 FRAUD' : '✅ LEGITIMATE'}
                            </span>
                          </td>
                          <td className="p-3">
                            <RiskBadge probability={result.probability} />
                          </td>
                          <td className="p-3">
                            <div className="flex gap-2 text-xs">
                              <span title="Temporal" className="bg-blue-100 text-blue-800 px-2 py-1 rounded">T:{result.specialist_probas.temporal}</span>
                              <span title="Geographical" className="bg-green-100 text-green-800 px-2 py-1 rounded">G:{result.specialist_probas.geographical}</span>
                              <span title="Behavioral" className="bg-amber-100 text-amber-800 px-2 py-1 rounded">B:{result.specialist_probas.behavioral}</span>
                              <span title="Composite" className="bg-purple-100 text-purple-800 px-2 py-1 rounded">C:{result.specialist_probas.composite}</span>
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {/* Model Insights */}
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div className="rounded-2xl border bg-white p-4 shadow-sm">
                  <h4 className="font-semibold mb-2">Temporal Specialist</h4>
                  <p className="text-sm text-slate-600">Analyzes time-based patterns (hour, day, night transactions)</p>
                </div>
                <div className="rounded-2xl border bg-white p-4 shadow-sm">
                  <h4 className="font-semibold mb-2">Geographical Specialist</h4>
                  <p className="text-sm text-slate-600">Examines location patterns and distance from home</p>
                </div>
                <div className="rounded-2xl border bg-white p-4 shadow-sm">
                  <h4 className="font-semibold mb-2">Behavioral Specialist</h4>
                  <p className="text-sm text-slate-600">Studies transaction velocity and client behavior</p>
                </div>
              </div>
            </div>
          )}

          {/* Empty State */}
          {!results && !loading && (
            <div className="rounded-2xl border-2 border-dashed border-slate-300 bg-white p-12 text-center">
              <svg className="mx-auto h-12 w-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
              </svg>
              <h3 className="mt-4 text-lg font-medium text-slate-900">No transactions analyzed</h3>
              <p className="mt-2 text-sm text-slate-600">Upload a CSV file to begin fraud detection analysis</p>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
