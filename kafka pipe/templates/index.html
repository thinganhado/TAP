<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Fraud operations</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Socket.IO client -->
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>

  <!-- React UMD + Babel -->
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    /* Scroll containers + sticky headers */
    .table-wrap { max-height: 420px; overflow: auto; }
    .alerts-wrap { max-height: 540px; overflow: auto; } /* Taller alerts panel */
    .table-wrap thead th,
    .alerts-wrap thead th { position: sticky; top: 0; background: #f8fafc; z-index: 1; }

    /* Force header/body column alignment */
    .table-fixed { table-layout: fixed; width: 100%; }
    .col-sm { width: 8rem; }   /* 128px  */
    .col-md { width: 10rem; }  /* 160px  */
    .col-lg { width: 14rem; }  /* 224px  */
    .col-xl { width: 18rem; }  /* 288px  */
    .truncate-cell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Badges */
    .badge { padding: 2px 8px; border-radius: 9999px; font-size: 12px; line-height: 18px; }
    .badge-green { background:#d1fae5; color:#065f46; }
    .badge-amber { background:#fef3c7; color:#92400e; }
    .badge-rose  { background:#ffe4e6; color:#9f1239; }

    /* Drawer (Analyse) */
    .drawer { position: fixed; inset: 0; background: rgba(0,0,0,.35); display:flex; justify-content:flex-end; }
    .drawer-panel { width: 720px; max-width: 95vw; height: 100%; background:#fff; box-shadow: -10px 0 30px rgba(0,0,0,.15); }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const {useEffect, useMemo, useState} = React;

    // ---------- utils ----------
    const clamp = (n, min, max) => Math.max(min, Math.min(max, n));
    const fmtTime = iso => { try { return new Date(iso).toLocaleString(); } catch { return iso??""; } };
    const fmtMoney = val => {
      if (val === undefined || val === null || val === "") return "";
      const num = Number(val);
      if (Number.isNaN(num)) return String(val);
      return num.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
    };
    const uid = () => Math.random().toString(36).slice(2,8);
    const median = arr => {
      if (!arr.length) return 0;
      const s = [...arr].sort((a,b)=>a-b);
      const i = Math.floor(s.length/2);
      return s.length%2 ? s[i] : (s[i-1]+s[i])/2;
    };

    // ---------- mapping ----------
    function mapBehRaw(ev){
      return {
        id: uid(),
        link: String(ev.link_id ?? ""),
        band: ev.geo_band ?? "",
        lat: typeof ev.latitude === "number" ? ev.latitude.toFixed(4) : ev.latitude ?? "",
        lon: typeof ev.longitude === "number" ? ev.longitude.toFixed(4) : ev.longitude ?? "",
        susp: ev.suspicion_score === "" || ev.suspicion_score == null
              ? "" : (typeof ev.suspicion_score === "number" ? ev.suspicion_score.toFixed(4) : ev.suspicion_score),
        when: ev.event_time ?? "",
        _raw: ev
      };
    }
    function mapTxnRaw(ev){
      return {
        id: uid(),
        link: String(ev.link_id ?? ""),
        type: ev.tx_type ?? "",
        amount: Number(ev.amount ?? 0),
        when: ev.event_time ?? "",
        src: ev.src_account, dst: ev.dst_account,
        srcBalB: ev.src_balance_before, srcBalA: ev.src_balance_after,
        _raw: ev
      };
    }
    function mapFlag(ev){
      const ctx = ev.context ?? {};
      let reason;
      if (ev.stream === "transaction") {
        const txType = ctx.tx_type ?? ev.tx_type ?? "";
        const balanceVal = ctx.new_balance ?? ctx.amount;
        const amountVal = ctx.tx_amount ?? ctx.amount;
        let detail = "";
        if (balanceVal !== undefined && balanceVal !== null && balanceVal !== "") {
          detail = `balance ${fmtMoney(balanceVal)}`;
        } else if (amountVal !== undefined && amountVal !== null && amountVal !== "") {
          detail = `amount ${fmtMoney(amountVal)}`;
        }
        reason = detail ? `${txType} • ${detail}` : txType;
      } else {
        const lat = ctx.latitude ?? "";
        const lon = ctx.longitude ?? "";
        const band = ctx.geo_band ?? "";
        reason = `${lat},${lon} • ${band}`;
      }
      return {
        id: uid(),
        type: ev.stream ?? "",
        risk: Number(ev.risk_score ?? 0),
        decision: ev.decision ?? "",
        reason,
        user: String(ev.link_id ?? ""),
        channel: (ev.stream ?? "").toUpperCase(),
        when: ev.event_time ?? "",
        _raw: ev
      };
    }

    function RiskBadge({risk}) {
      const pct = clamp(Math.round((risk ?? 0)*100), 0, 100);
      let cls = "badge badge-green";
      if (pct >= 70) cls = "badge badge-rose";
      else if (pct >= 40) cls = "badge badge-amber";
      return <span className={cls}>Risk {pct}</span>;
    }

    function KPI({label, value, sub}) {
      return (
        <div className="bg-white rounded-2xl shadow-sm p-5 border border-slate-100">
          <div className="text-sm text-slate-500">{label}</div>
          <div className="text-3xl font-semibold mt-1">{value}</div>
          {sub ? <div className="text-xs text-slate-400 mt-1">{sub}</div> : null}
        </div>
      );
    }
    function Card({children, className=""}) {
      return <div className={`bg-white rounded-2xl shadow-sm p-4 border border-slate-100 ${className}`}>{children}</div>;
    }

    // ---------- main ----------
    function App(){
      const [tab, setTab] = useState("beh"); // 'beh' | 'txn'
      const [connected, setConnected] = useState(false);

      const [behFeed, setBehFeed] = useState([]); // behaviours raw
      const [txnFeed, setTxnFeed] = useState([]); // transactions raw
      const [alerts, setAlerts] = useState([]);   // flagged
      const [query, setQuery] = useState("");

      // Selected alert for Analyse drawer
      const [drawer, setDrawer] = useState(null);

      // hydrate + sockets
      useEffect(() => {
        fetch("/snapshot", { cache: "no-store" })
          .then(r=>r.json())
          .then(({behaviours_raw=[], transactions_raw=[], flagged=[]}) => {
            setBehFeed(behaviours_raw.map(mapBehRaw));
            setTxnFeed(transactions_raw.map(mapTxnRaw));
            setAlerts(flagged.map(mapFlag));
          }).catch(()=>{});

        const s = io({transports:["websocket"], upgrade:false, reconnection:true, timeout:5000});
        s.on("connect", ()=> setConnected(true));
        s.on("disconnect", ()=> setConnected(false));
        s.on("beh_raw",  ev => setBehFeed(f => [mapBehRaw(ev), ...f].slice(0,500)));
        s.on("txn_raw",  ev => setTxnFeed(f => [mapTxnRaw(ev), ...f].slice(0,500)));
        s.on("flag_event", ev => setAlerts(a => [mapFlag(ev), ...a].slice(0,500)));
        return () => s.close();
      }, []);

      // fallback polling
      useEffect(() => {
        if (connected) return;
        const t = setInterval(() => {
          fetch("/snapshot", { cache: "no-store" })
          .then(r=>r.json())
          .then(({behaviours_raw=[], transactions_raw=[], flagged=[]}) => {
            setBehFeed(behaviours_raw.map(mapBehRaw));
            setTxnFeed(transactions_raw.map(mapTxnRaw));
            setAlerts(flagged.map(mapFlag));
          }).catch(()=>{});
        }, 2000);
        return () => clearInterval(t);
      }, [connected]);

      const medianRiskPct = useMemo(() =>
        Math.round(median(alerts.map(a => (a.risk ?? 0)*100))), [alerts]);

      const filteredAlerts = useMemo(() => {
        if (!query) return alerts;
        const q = query.toLowerCase();
        return alerts.filter(a =>
          a.type.toLowerCase().includes(q) ||
          (a.reason ?? "").toLowerCase().includes(q) ||
          (a.user ?? "").toLowerCase().includes(q) ||
          (a.channel ?? "").toLowerCase().includes(q)
        );
      }, [alerts, query]);

      // Rows for the analyse drawer (last 10 per link)
      const lastForLink = (link) => ({
        beh: behFeed.filter(b => b.link === link).slice(0,10),
        txn: txnFeed.filter(t => t.link === link).slice(0,10),
        flags: alerts.filter(a => a.user === link).slice(0,10)
      });

      return (
        <div className="max-w-7xl mx-auto p-6">
          {/* Header */}
          <div className="flex items-center justify-between mb-6">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-full bg-indigo-600 text-white flex items-center justify-center font-semibold">F</div>
              <h1 className="text-2xl font-semibold">Fraud operations</h1>
              <span className={`ml-3 text-xs px-2 py-1 rounded ${connected ? "bg-emerald-100 text-emerald-700" : "bg-slate-200 text-slate-600"}`}>
                {connected ? "live" : "offline (polling)"}
              </span>
            </div>
            <div className="flex gap-2">
              <button className="px-3 py-2 rounded-xl text-sm bg-slate-100 text-slate-700 cursor-not-allowed">Reset demo data</button>
              <button className="px-3 py-2 rounded-xl text-sm bg-indigo-600 text-white cursor-not-allowed">Inject alert</button>
            </div>
          </div>

          {/* KPIs */}
          <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
            <KPI label="Live users" value={behFeed.length} sub="rolling feed" />
            <KPI label="Live transactions" value={txnFeed.length} sub="rolling feed" />
            <KPI label="Alerts today" value={alerts.length} sub="all sources" />
            <KPI label="Median risk" value={medianRiskPct} sub="computed" />
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
            {/* BIG: Alerts (2/3 width) */}
            <Card className="lg:col-span-2 shadow-md">
              <div className="flex items-center justify-between mb-3">
                <h3 className="font-semibold">Alerts and anomaly queue</h3>
                <input
                  className="px-3 py-1.5 text-sm bg-slate-100 rounded-xl outline-none"
                  placeholder="Search user, type, reason"
                  value={query}
                  onChange={e=>setQuery(e.target.value)}
                />
              </div>
              <div className="alerts-wrap rounded-xl border border-slate-100">
                <table className="table-fixed text-sm">
                  <thead>
                    <tr className="text-left text-slate-500">
                      <th className="p-2 col-md">Type</th>
                      <th className="p-2 col-sm">Risk</th>
                      <th className="p-2 col-xl">Reason</th>
                      <th className="p-2 col-md">User</th>
                      <th className="p-2 col-sm">Channel</th>
                      <th className="p-2 col-lg">When</th>
                      <th className="p-2 col-sm">Action</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filteredAlerts.map(r => (
                      <tr key={r.id} className="odd:bg-white even:bg-slate-50">
                        <td className="p-2 capitalize">{r.type}</td>
                        <td className="p-2"><RiskBadge risk={r.risk} /></td>
                        <td className="p-2 truncate-cell" title={r.reason}>{r.reason}</td>
                        <td className="p-2 truncate-cell">{r.user}</td>
                        <td className="p-2">{r.channel}</td>
                        <td className="p-2 text-slate-600">{fmtTime(r.when)}</td>
                        <td className="p-2">
                          <button
                            className="px-3 py-1.5 rounded-xl bg-slate-900 text-white text-xs"
                            onClick={() => setDrawer(r)}
                          >Analyse</button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
              <div className="text-xs text-slate-400 mt-2">{filteredAlerts.length} alerts</div>
            </Card>

            {/* SMALL: Feeds (1/3 width) */}
            <Card>
              <div className="flex items-center gap-2 mb-3">
                <button
                  className={`px-3 py-1.5 rounded-xl text-sm ${tab==="beh" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-700"}`}
                  onClick={() => setTab("beh")}
                >User activity</button>
                <button
                  className={`px-3 py-1.5 rounded-xl text-sm ${tab==="txn" ? "bg-slate-900 text-white" : "bg-slate-100 text-slate-700"}`}
                  onClick={() => setTab("txn")}
                >Transactions</button>
              </div>

              {tab === "beh" ? (
                <div className="table-wrap rounded-xl border border-slate-100">
                  <table className="table-fixed text-sm">
                    <thead>
                      <tr className="text-left text-slate-500">
                        <th className="p-2 col-sm">Link</th>
                        <th className="p-2 col-sm">Band</th>
                        <th className="p-2 col-sm">Lat</th>
                        <th className="p-2 col-sm">Lon</th>
                        <th className="p-2 col-lg">When</th>
                      </tr>
                    </thead>
                    <tbody>
                      {behFeed.map(r => (
                        <tr key={r.id} className="odd:bg-white even:bg-slate-50">
                          <td className="p-2 truncate-cell">{r.link}</td>
                          <td className="p-2">{r.band}</td>
                          <td className="p-2">{r.lat}</td>
                          <td className="p-2">{r.lon}</td>
                          <td className="p-2 text-slate-600">{fmtTime(r.when)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              ) : (
                <div className="table-wrap rounded-xl border border-slate-100">
                  <table className="table-fixed text-sm">
                    <thead>
                      <tr className="text-left text-slate-500">
                        <th className="p-2 col-md">Type</th>
                        <th className="p-2 col-md">Amount</th>
                        <th className="p-2 col-md">Link</th>
                        <th className="p-2 col-lg">When</th>
                      </tr>
                    </thead>
                    <tbody>
                      {txnFeed.map(r => (
                        <tr key={r.id} className="odd:bg-white even:bg-slate-50">
                          <td className="p-2 truncate-cell">{r.type}</td>
                          <td className="p-2">{r.amount}</td>
                          <td className="p-2 truncate-cell">{r.link}</td>
                          <td className="p-2 text-slate-600">{fmtTime(r.when)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </Card>
          </div>

          {/* Analyse drawer */}
          {drawer && (
            <div className="drawer" onClick={()=>setDrawer(null)}>
              <div className="drawer-panel" onClick={e=>e.stopPropagation()}>
                <div className="p-6 border-b border-slate-200 flex items-center justify-between">
                  <div>
                    <div className="text-sm text-slate-500">Link</div>
                    <div className="text-xl font-semibold">{drawer.user}</div>
                  </div>
                  <div className="flex items-center gap-3">
                    <RiskBadge risk={drawer.risk} />
                    <button className="px-3 py-2 rounded-xl bg-slate-100" onClick={()=>setDrawer(null)}>Close</button>
                    <button className="px-3 py-2 rounded-xl bg-indigo-600 text-white">Open case</button>
                  </div>
                </div>

                {/* Summary row */}
                <div className="p-6 grid grid-cols-1 md:grid-cols-3 gap-4">
                  <div className="bg-slate-50 rounded-xl p-4">
                    <div className="text-xs text-slate-500 mb-1">Alert type</div>
                    <div className="font-medium capitalize">{drawer.type}</div>
                  </div>
                  <div className="bg-slate-50 rounded-xl p-4">
                    <div className="text-xs text-slate-500 mb-1">When</div>
                    <div className="font-medium">{fmtTime(drawer.when)}</div>
                  </div>
                  <div className="bg-slate-50 rounded-xl p-4">
                    <div className="text-xs text-slate-500 mb-1">Reason / context</div>
                    <div className="font-medium break-words">{drawer.reason}</div>
                  </div>
                </div>

                {/* Recent activity for this link */}
                <div className="p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div>
                    <div className="font-semibold mb-2">Recent behaviour (last 10)</div>
                    <div className="table-wrap rounded-xl border border-slate-100">
                      <table className="table-fixed text-sm">
                        <thead>
                          <tr className="text-left text-slate-500">
                            <th className="p-2 col-sm">Band</th>
                            <th className="p-2 col-md">Lat, Lon</th>
                            <th className="p-2 col-lg">When</th>
                          </tr>
                        </thead>
                        <tbody>
                          {lastForLink(drawer.user).beh.map(r=>(
                            <tr key={r.id} className="odd:bg-white even:bg-slate-50">
                              <td className="p-2">{r.band}</td>
                              <td className="p-2 truncate-cell">{r.lat},{r.lon}</td>
                              <td className="p-2 text-slate-600">{fmtTime(r.when)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>

                  <div>
                    <div className="font-semibold mb-2">Recent transactions (last 10)</div>
                    <div className="table-wrap rounded-xl border border-slate-100">
                      <table className="table-fixed text-sm">
                        <thead>
                          <tr className="text-left text-slate-500">
                            <th className="p-2 col-md">Type</th>
                            <th className="p-2 col-md">Amount</th>
                            <th className="p-2 col-lg">When</th>
                          </tr>
                        </thead>
                        <tbody>
                          {lastForLink(drawer.user).txn.map(r=>(
                            <tr key={r.id} className="odd:bg-white even:bg-slate-50">
                              <td className="p-2 truncate-cell">{r.type}</td>
                              <td className="p-2">{r.amount}</td>
                              <td className="p-2 text-slate-600">{fmtTime(r.when)}</td>
                            </tr>
                          ))}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>

                {/* Prior alerts */}
                <div className="p-6">
                  <div className="font-semibold mb-2">Prior alerts for this link</div>
                  <div className="table-wrap rounded-xl border border-slate-100">
                    <table className="table-fixed text-sm">
                      <thead>
                        <tr className="text-left text-slate-500">
                          <th className="p-2 col-md">Type</th>
                          <th className="p-2 col-sm">Risk</th>
                          <th className="p-2 col-xl">Reason</th>
                          <th className="p-2 col-lg">When</th>
                        </tr>
                      </thead>
                      <tbody>
                        {lastForLink(drawer.user).flags.map(r=>(
                          <tr key={r.id} className="odd:bg-white even:bg-slate-50">
                            <td className="p-2 capitalize">{r.type}</td>
                            <td className="p-2"><RiskBadge risk={r.risk} /></td>
                            <td className="p-2 truncate-cell" title={r.reason}>{r.reason}</td>
                            <td className="p-2 text-slate-600">{fmtTime(r.when)}</td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>

              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
